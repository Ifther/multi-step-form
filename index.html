<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Multi-step form</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
        <div class="background ">
          <img src="./assets/images/bg-sidebar-desktop.svg" alt="bg-sidebsr" />
        </div>
        <ul class="steps">
          <div class = "anchor-elements">
            <a class ="number-anchors pressed-bg" href="index.html">1</a>
            <div>
              <p>step 1</p>
              <a href="index.html">YOUR INFO</a>
            </div>
          </div>
          <div class = "anchor-elements">
            <a class ="number-anchors " href="step-2.html">2</a>
            <div>
              <p>step 2</p>
              <a href="step-2.html">SELECT PLAN</a>
            </div>
          </div>
          <div class = "anchor-elements">
            <a  class ="number-anchors " href="step-3.html">3</a>
            <div>
              <p>step 3</p>
              <a href="step-3.html">ADD-ONS</a>
            </div>
          </div>
          <div class = "anchor-elements">
            <a class ="number-anchors " href="step-4.html">4</a>
            <div>
              <p>step 4</p>
              <a href="step-4.html">SUMMARY</a>
            </div>
          </div>
        </ul>
      <div class="user-info">
        <div>
          <h1>Personal info</h1>
          <p>Please provide your name, email address, and phone number.</p>
        </div>
        <form action="">
          <label for="name-holder">Name</label>
          <input type="text" id="name-holder" placeholder="e.g.Stephen King" />
          <br />
          <label for="email-holder">Email Address</label>
          <input
            type="email"
            id="email-holder"
            placeholder="e.g.stephenking@lorem.com"
          />
          <br />
          <label for="phone-no-holder">Phone Number</label>
          <input
            type="tel"
            id="phone-no-holder"
            placeholder="e.g.+1 234 567 890"
          />
          <br />
        </form>
        <div >
          <a class = "next-step-btn" href="step-2.html">Next Step</a>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
